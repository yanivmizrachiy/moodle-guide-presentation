name: Emergency Jerusalem2 Promote

on:
  push:
    branches: [main]
    paths:
      - '.github/emergency-jerusalem2-trigger'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Require existing Vercel credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "NO_VERCEL_TOKEN_IN_THIS_REPOSITORY"
            exit 2
          fi
          echo "VERCEL_TOKEN_PRESENT"

      - name: Verify known-good deployment before promotion
        shell: bash
        run: |
          set -euo pipefail
          url='https://jerusalem2-fc7vx9a3a-yanivs-projects-322b2b37.vercel.app/'
          body="$(curl -fsSL "$url")"
          printf '%s' "$body" | grep -Fq 'מחוז ירושלים — מתמטיקה'
          echo "KNOWN_GOOD_HTTP_200_AND_MARKER_OK"

      - name: Promote known-good deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@59.25.4 promote 'https://jerusalem2-fc7vx9a3a-yanivs-projects-322b2b37.vercel.app' --yes --scope 'yanivs-projects-322b2b37' --token "$VERCEL_TOKEN"

      - name: Verify canonical site
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code="$(curl -L -sS -o /tmp/j2.html -w '%{http_code}' 'https://jerusalem2.vercel.app/' || true)"
            if [ "$code" = '200' ] && grep -Fq 'מחוז ירושלים — מתמטיקה' /tmp/j2.html; then
              echo "JERUSALEM2_RECOVERED_HTTP_200"
              exit 0
            fi
            sleep 5
          done
          echo "JERUSALEM2_CANONICAL_VERIFY_FAILED"
          exit 3
