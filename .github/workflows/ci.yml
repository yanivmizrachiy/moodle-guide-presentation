name: Presentation CI

on:
  pull_request:
  workflow_dispatch:

# PR validation only. Main is validated again by Deploy Presentation before
# GitHub Pages publication, so running this workflow on main would duplicate
# npm/check and Playwright work without adding a distinct gate.
#
# A newer commit makes an older CI result irrelevant. Keep only the newest run
# for the same PR/ref and free runners for it.
concurrency:
  group: presentation-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # External builders such as Google AI Studio do not run inside GitHub
      # Actions. Exercise that exact portable build mode explicitly.
      - name: Verify portable external-builder build
        env:
          GITHUB_ACTIONS: 'false'
        run: npm run build
      # Also pin the production Pages mode so portability can never break the
      # deployed repository subpath.
      - name: Verify GitHub Pages build
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build
      - name: Ensure check did not mutate tracked source
        run: git diff --exit-code

  # The broad browser gate: the full Playwright suite described in
  # playwright.config.ts.
  # This job intentionally runs on Windows because the committed visual
  # baselines are win32 snapshots; on Ubuntu those tests are deliberately skipped.
  browser:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test
      - name: Ensure browser tests did not mutate tracked source
        shell: bash
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
