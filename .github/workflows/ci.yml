name: Presentation CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit makes an older CI result irrelevant. This is especially
# important when several tools/agents work on the repository at the same time:
# keep only the newest run for the same PR/ref and free runners for it.
concurrency:
  group: presentation-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The broad browser gate: navigation, two-path branches, flows/hotspots,
  # the edit-mode teaching control, accessibility scans and visual regression.
  # This job intentionally runs on Windows because the committed visual
  # baselines are win32 snapshots; on Ubuntu those tests are deliberately skipped.
  browser:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
