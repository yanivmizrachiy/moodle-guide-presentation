name: Emergency Jerusalem2 External Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/j2-external-verify-trigger'

permissions:
  contents: read

jobs:
  verify-jerusalem2:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout Jerusalem2 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yanivmizrachiy/jerusalem2
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify fast
        run: npm run verify:fast
