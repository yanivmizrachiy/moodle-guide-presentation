<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the guide paint into a notched phone's safe areas
         instead of leaving black bars; the shell pads itself back with env(safe-area-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Real fullscreen on every device (REQ-PRESENTATION-004). On desktop and
         Android the Fullscreen API does it. On iPhone that API does not exist for
         anything but <video>, so the only true fullscreen is "Add to Home Screen":
         these declarations are what make iOS open the guide with no address bar
         and no browser chrome at all. -->
    <!-- Relative, and deliberately unlike the %BASE_URL% icon links below: the Vite
         DEV server prefixes the base onto a manifest href, so %BASE_URL% there
         yields the base twice and serves the HTML fallback. The production build
         leaves this href untouched, and the page is only ever served from the base
         path itself (navigation is ?slide=, never a deeper path), so the relative
         form is the one spelling that resolves correctly in dev and in production. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="מדריך Moodle" />
    <title>מדריך Moodle למורים</title>
    <meta
      name="description"
      content="מצגת הדרכה למורים במערכת Moodle של משרד החינוך: פתיחת מרחב למידה, תלמידים, משימות, ציונים ומעקב — עם צילומי מסך אמיתיים בלבד."
    />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/webp" href="%BASE_URL%guide/jerusalem-math-logo.webp" />
    <link rel="apple-touch-icon" href="%BASE_URL%guide/jerusalem-math-logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="מדריך Moodle למורים" />
    <meta
      property="og:description"
      content="מצגת הדרכה אינטראקטיבית למורים במערכת Moodle — מחוז ירושלים והעיר ירושלים."
    />
    <meta property="og:url" content="https://yanivmizrachiy.github.io/moodle-guide-presentation/" />
    <meta
      property="og:image"
      content="https://yanivmizrachiy.github.io/moodle-guide-presentation/guide/jerusalem-math-logo.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
